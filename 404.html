<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Mood Mixer</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6158d9">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 460px;
      padding: 32px 28px;
      border: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent);
      border-radius: var(--radius);
      background: var(--color-surface);
      box-shadow: var(--shadow);
    }

    .mark {
      color: var(--color-primary);
      font-size: 2rem;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--color-muted);
      font-size: 0.9rem;
    }

    a {
      display: inline-block;
      margin: 4px;
      padding: 9px 15px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-solid);
      color: var(--color-text);
      font-weight: 600;
      text-decoration: none;
    }

    a.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-primary-contrast);
    }
  </style>
</head>

<body>
  <main>
    <div class="mark" aria-hidden="true">&#10035;</div>
    <h1>That color does not exist here.</h1>
    <p>The page you asked for is missing. The mixer and the landing page both still work.</p>
    <a class="primary" href="/">Landing page</a>
    <a href="/mixer/">Open the mixer</a>
  </main>
</body>

</html>
